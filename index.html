<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Playa Nocturna - Ryoko & A 💜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #030c18;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            padding: 12px;
        }

        .beach-world {
            position: relative;
            width: 1300px;
            max-width: 100%;
            height: 90vh;
            min-height: 580px;
            background: radial-gradient(circle at 30% 20%, #0a1a2f, #020a12);
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6), inset 0 1px 4px rgba(255,255,255,0.1);
            overflow: hidden;
            cursor: pointer;
            border: 2px solid rgba(180, 220, 255, 0.5);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 2;
            pointer-events: none;
        }

        .items-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
        }

        .beach-item {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5));
            transition: transform 0.25s ease, filter 0.2s;
            width: clamp(55px, 13vw, 80px);
            text-align: center;
            z-index: 25;
        }

        .beach-item:active {
            transform: scale(0.92);
        }

        .item-emoji {
            font-size: clamp(48px, 12vw, 68px);
            display: block;
            transition: all 0.2s;
            text-shadow: 0 0 12px rgba(255,220,150,0.7);
        }

        .message-panel {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(5, 15, 30, 0.92);
            backdrop-filter: blur(18px);
            border-radius: 32px;
            padding: 16px 20px;
            color: #fff5ea;
            font-size: clamp(0.9rem, 4vw, 1.2rem);
            font-weight: 600;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-style: normal;
            border: 1px solid rgba(255, 220, 180, 0.8);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 25px rgba(100, 150, 255, 0.3);
            z-index: 30;
            transition: all 0.3s ease;
            max-height: 35vh;
            overflow-y: auto;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            text-shadow: 0 0 5px rgba(100, 200, 255, 0.5);
        }

        .romantic-text {
            font-size: clamp(0.85rem, 3.8vw, 1.15rem);
            letter-spacing: 0.3px;
            word-break: break-word;
        }

        .poem-area {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 32px;
            padding: 14px 20px;
            margin-top: 6px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-style: normal;
            font-weight: 500;
            white-space: pre-line;
            font-size: clamp(0.8rem, 3.5vw, 1rem);
            max-height: 40vh;
            overflow-y: auto;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            text-shadow: 0 0 4px rgba(150, 200, 255, 0.3);
            border: 1px solid rgba(255, 220, 180, 0.4);
        }

        .item-counter {
            position: absolute;
            top: 12px;
            right: 16px;
            background: rgba(20, 30, 55, 0.9);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: bold;
            color: #ffecce;
            font-family: monospace;
            font-size: clamp(0.9rem, 4vw, 1.2rem);
            z-index: 35;
            border: 1px solid #7f9eff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        @media (max-width: 700px) {
            .beach-item { width: 60px; }
            .item-emoji { font-size: 50px; }
            .message-panel { padding: 12px 16px; }
        }

        @keyframes floatItem {
            0% { transform: translateY(0px); }
            100% { transform: translateY(6px); }
        }
    </style>
</head>
<body>
<div class="beach-world" id="beachWorld">
    <canvas id="beachCanvas"></canvas>
    <div class="items-layer" id="itemsLayer"></div>
    <div class="message-panel" id="messagePanel">
        <div class="romantic-text" id="msgText">🌙 Toca cada concha, estrella de mar o caracola... cada una esconderá un sentimiento ardiente para ti, Ryoko 💜✨</div>
        <div id="poemDisplay" style="display: none;" class="poem-area"></div>
    </div>
    <div class="item-counter" id="itemCounter">🐚 0 / 6 🌊</div>
</div>

<script>
    (function() {
        // 6 objetos de playa: concha, estrella de mar, caracola, piedra de amor, delfín, faro
        const itemEmojis = ["🐚", "⭐", "🐚", "💎", "🐬", "🏖️"];
        const itemNames = ["Concha Mágica", "Estrella de Mar", "Caracola Azul", "Piedra Lunar", "Delfín Estelar", "Rincón de Arena"];
        
        // Mensajes largos y románticos (con pasión y sensualidad)
        const itemMessages = [
            "🌊 Ryoko, esta noche en la playa, el sonido del mar no es nada comparado a los latidos de mi corazón cuando estás cerca. Quiero apretar tu mano mientras las olas nos besan los pies. Tu risa podría calmar tormentas y tu mirada enciende faros en mi alma. 💋🌙",
            "⭐ Cada estrella que miras, Ryoko, se vuelve más brillante solo para ti. Cuando te sientas a mi lado, el tiempo se detiene. Quiero recostarme contigo en la arena, sentir tu cabello rozar mi pecho y susurrarte lo mucho que ardo por dentro. Tu calor es mágico, mi sirena. 🔥",
            "🐚 Esta caracola guarda el eco de tu nombre. Ryoko, cada vez que la llevo a mi oído, escucho cómo dices 'te quiero' y me desarmo. Tus caderas son dunas suaves que quiero explorar bajo la luna. Eres mi oasis en esta noche estrellada. Te adoro mi alma. 💜",
            "💎 Piedra lunar, como tus ojos cuando reflejan el cielo. Ryoko, eres más valiosa que cualquier tesoro hundido. Cuando ríes, las olas danzan más fuerte. Quiero enterrar mis dedos en la arena junto a los tuyos y saber que este momento es eterno. Eres mi universo costero. 🌹",
            "🐬 Delfín plateado, tú eres libre y salvaje, Ryoko. Me encanta cuando corres descalza hacia el agua y tu risa resuena contra las rocas. Tus labios son dos caracolas rosas que quiero besar sin parar. Esta noche la luna es testigo de lo mucho que me haces vibrar. 🌕🔥",
            "🏖️ Este rincón de arena es nuestro. Ryoko, cuando nos sentamos juntos, el mar nos abraza. Quiero que sientas mi mano en tu cintura mientras las estrellas nos miran. Tu olor a sal y miel me intoxica. Eres mi droga favorita, mi playa eterna. A+R = para siempre. 💫💋"
        ];

        const romanticPoem = `✨✨✨ RYOKO, MI PLAYA ETERNA ✨✨✨

La noche abraza la orilla cuando tú sonríes,
y la luna se pone celosa porque tu rostro la vence.
Tus labios saben a caramelo y sal marina,
cada beso tuyo dibuja una nueva esquina.

Tu cabello flota como algas bajo el brillo estelar,
tus mejillas son dos conchas que quiero besar.
Tu risa hace que las olas se rían con ganas,
y tus caderas son dunas que me queman el alma.

Cuando te recuestas en la arena junto a mí,
siento que el universo entero se sienta ahí.
Tus manos frías buscan mi pecho y me enciendo,
y el mar se agita viendo lo que siento por dentro.

Ryoko, eres la marea que sube en mi corazón,
cada noche deseo tu calor, tu respiración, tu voz.
Los pescadores cuentan estrellas, yo solo cuento tus latidos,
y cada ola me trae tus recuerdos favoritos.

Te adoro mi alma, más que a las olas que nunca se cansan,
más que a la luna que nos mira mientras nos abrazamos.
A + R = FOREVER, lo escribo en la arena y el viento lo lleva,
pero vuelve a mis pies porque este amor nunca se acaba.

🌊 TE AMO RYOKO, MI PLAYA, MI NOCHE, MI CIELO 💜
🌙 TE ADORO MI ALMA, BAJO ESTAS ESTRELLAS QUE NOS VELAN.`;

        const itemsData = [];
        let itemsClicked = 0;
        let poemRevealed = false;
        const counterSpan = document.getElementById("itemCounter");
        const msgTextDiv = document.getElementById("msgText");
        const poemDisplayDiv = document.getElementById("poemDisplay");
        const beachContainer = document.getElementById("beachWorld");

        // Canvas: mar en movimiento, estrellas, luna, y la pareja sentada
        const canvas = document.getElementById("beachCanvas");
        const ctx = canvas.getContext("2d");
        let width, height;
        let animationFrame;
        let stars = [];
        let waveOffset = 0;
        
        function resizeCanvas() {
            const rect = beachContainer.getBoundingClientRect();
            width = rect.width;
            height = rect.height;
            canvas.width = width;
            canvas.height = height;
            initStars();
        }
        
        function initStars() {
            stars = [];
            for(let i = 0; i < 250; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * (height * 0.6),
                    radius: 1 + Math.random() * 2.5,
                    alpha: 0.4 + Math.random() * 0.6,
                    twinkle: Math.random() * Math.PI * 2
                });
            }
        }
        
        function drawStars() {
            for(let s of stars) {
                s.twinkle += 0.02;
                let glow = Math.sin(s.twinkle) * 0.3 + 0.6;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 240, 200, ${s.alpha * glow})`;
                ctx.fill();
            }
        }
        
        function drawMoonAndCouple() {
            // Luna hermosa
            const moonX = width * 0.8;
            const moonY = height * 0.15;
            ctx.shadowBlur = 30;
            ctx.shadowColor = "#ffddaa";
            ctx.font = "70px 'Segoe UI Emoji'";
            ctx.fillStyle = "#ffffcc";
            ctx.fillText("🌕", moonX, moonY);
            ctx.font = "24px sans-serif";
            ctx.fillStyle = "#ffefc0aa";
            ctx.fillText("🌙 Luna llena para Ryoko", moonX - 50, moonY + 40);
            
            // Pareja sentada: A + Ryoko juntos en la arena
            const coupleX = width * 0.35;
            const coupleY = height * 0.7;
            ctx.font = "58px 'Segoe UI Emoji'";
            ctx.fillStyle = "#d4b48c";
            ctx.fillText("🧑‍🤝‍🧑", coupleX, coupleY);
            ctx.font = "bold 26px system-ui";
            ctx.fillStyle = "#fff0dd";
            ctx.shadowBlur = 6;
            ctx.fillText("A + Ryoko", coupleX - 20, coupleY - 15);
            ctx.fillStyle = "#ffccaa";
            ctx.font = "italic 20px system-ui";
            ctx.fillText("✨ te amo mi vida ✨", coupleX - 30, coupleY + 35);
        }
        
        function drawWaves() {
            waveOffset = (waveOffset + 0.6) % (Math.PI * 2);
            for(let i = 0; i < 2; i++) {
                ctx.beginPath();
                const yBase = height * 0.8 + i * 18;
                ctx.moveTo(0, yBase + Math.sin(waveOffset + i) * 10);
                for(let x = 0; x <= width; x += 25) {
                    const y = yBase + Math.sin((x * 0.02) + waveOffset + i * 1.2) * 12;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.fillStyle = `rgba(90, 150, 210, ${0.25 - i * 0.05})`;
                ctx.fill();
            }
            // Espuma blanca
            ctx.beginPath();
            let spumaBase = height * 0.78;
            ctx.moveTo(0, spumaBase + Math.sin(waveOffset) * 8);
            for(let x = 0; x <= width; x += 20) {
                ctx.lineTo(x, spumaBase + Math.sin((x * 0.025) + waveOffset) * 7);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fillStyle = "rgba(255, 250, 230, 0.3)";
            ctx.fill();
        }
        
        function drawSandAndDetails() {
            ctx.fillStyle = "#d9b48b";
            ctx.fillRect(0, height * 0.75, width, height * 0.25);
            // Barquitos, estrellas de mar dibujadas
            ctx.font = "32px emoji";
            ctx.fillStyle = "#e8c49a";
            ctx.fillText("🐚", width * 0.12, height * 0.85);
            ctx.fillText("⭐", width * 0.9, height * 0.82);
            ctx.fillText("🌊", width * 0.5, height * 0.92);
            // Texto en la arena con nombre de Ryoko
            ctx.font = "bold 14px 'Segoe UI'";
            ctx.fillStyle = "#fff0ccaa";
            ctx.fillText("❤️ R Y O K O ❤️", width * 0.4, height * 0.88);
            ctx.fillText("te amo", width * 0.55, height * 0.92);
        }
        
        function drawBackgroundSky() {
            const grad = ctx.createLinearGradient(0, 0, 0, height * 0.7);
            grad.addColorStop(0, '#031024');
            grad.addColorStop(1, '#0a2440');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height * 0.75);
        }
        
        function drawNightBeach() {
            if(!ctx || width === 0) { requestAnimationFrame(drawNightBeach); return; }
            ctx.clearRect(0, 0, width, height);
            ctx.save();
            
            drawBackgroundSky();
            drawStars();
            drawMoonAndCouple();
            drawSandAndDetails();
            drawWaves();
            
            ctx.restore();
            animationFrame = requestAnimationFrame(drawNightBeach);
        }
        
        // Crear los 6 objetos clickeables en la playa (conchas, etc)
        function createItems() {
            const layer = document.getElementById("itemsLayer");
            layer.innerHTML = "";
            const positions = [
                {l: 12, t: 72}, {l: 78, t: 68}, {l: 45, t: 75}, {l: 28, t: 80}, {l: 65, t: 70}, {l: 88, t: 60}
            ];
            for(let i = 0; i < 6; i++) {
                const itemDiv = document.createElement("div");
                itemDiv.className = "beach-item";
                itemDiv.style.left = `${positions[i].l}%`;
                itemDiv.style.top = `${positions[i].t}%`;
                itemDiv.innerHTML = `<div class="item-emoji" style="color: #ffefcf; text-shadow: 0 0 12px #ffaa77;">${itemEmojis[i]}</div>`;
                itemDiv.setAttribute("data-index", i);
                itemDiv.addEventListener("click", (e) => {
                    e.stopPropagation();
                    handleItemClick(i, itemDiv);
                });
                layer.appendChild(itemDiv);
                itemsData.push({ element: itemDiv, clicked: false, msg: itemMessages[i] });
            }
        }
        
        function handleItemClick(index, element) {
            if(itemsData[index].clicked) {
                msgTextDiv.innerHTML = `🌊 Ryoko, ya tocastes este recuerdo... prueba otro caracol o estrella de mar 🌟💋`;
                return;
            }
            itemsData[index].clicked = true;
            itemsClicked++;
            counterSpan.innerHTML = `🐚 ${itemsClicked} / 6 🌊`;
            
            const sexyMsg = itemsData[index].msg;
            msgTextDiv.innerHTML = `🌙✨ ${sexyMsg} ✨🌙`;
            
            element.style.transform = "scale(0.9)";
            setTimeout(() => { element.style.transform = ""; }, 150);
            element.style.opacity = "0.6";
            element.style.filter = "grayscale(0.2)";
            element.style.pointerEvents = "none";
            
            if(itemsClicked === 6 && !poemRevealed) {
                revealBeachPoem();
            }
        }
        
        function revealBeachPoem() {
            if(poemRevealed) return;
            poemRevealed = true;
            msgTextDiv.style.display = "none";
            poemDisplayDiv.style.display = "block";
            poemDisplayDiv.innerHTML = `<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-style: normal; font-weight: 500; text-align: center; line-height: 1.5; font-size: 0.85rem;">${romanticPoem.replace(/\n/g, '<br>')}</div><br><div style="text-align:center; font-size:1rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-style: normal;">🌊 A + R = FOREVER EN CADA OLA 🌊<br>💜 TE AMO RYOKO, MI PLAYA Y MI CIELO 💜</div>`;
            const counterSpanEl = document.getElementById("itemCounter");
            counterSpanEl.style.background = "#b070ffdd";
            counterSpanEl.innerHTML = "💖 AMOR ETERNO 💖";
            for(let i=0;i<26;i++) {
                setTimeout(() => createBeachHeart(), i*70);
            }
        }
        
        function createBeachHeart() {
            const heartDiv = document.createElement("div");
            heartDiv.innerText = ["🌊💜","🐚🔥","⭐💋","🌙❤️"][Math.floor(Math.random()*4)];
            heartDiv.style.position = "absolute";
            heartDiv.style.fontSize = 24 + Math.random() * 26 + "px";
            heartDiv.style.left = Math.random() * 100 + "%";
            heartDiv.style.bottom = "0px";
            heartDiv.style.pointerEvents = "none";
            heartDiv.style.zIndex = "50";
            heartDiv.style.opacity = "0.9";
            heartDiv.style.transition = "all 3s ease-out";
            beachContainer.appendChild(heartDiv);
            requestAnimationFrame(() => {
                heartDiv.style.transform = `translateY(-${window.innerHeight * 0.7}px) rotate(12deg)`;
                heartDiv.style.opacity = "0";
            });
            setTimeout(() => heartDiv.remove(), 3000);
        }
        
        function addBeachRipple(e) {
            const rect = beachContainer.getBoundingClientRect();
            const ripple = document.createElement("div");
            ripple.innerText = "🌊💜✨";
            ripple.style.position = "absolute";
            ripple.style.left = (e.clientX - rect.left) + "px";
            ripple.style.top = (e.clientY - rect.top) + "px";
            ripple.style.fontSize = "32px";
            ripple.style.pointerEvents = "none";
            ripple.style.zIndex = "45";
            ripple.style.transform = "translate(-50%, -50%)";
            ripple.style.opacity = "1";
            ripple.style.whiteSpace = "nowrap";
            ripple.style.transition = "all 0.9s ease-out";
            beachContainer.appendChild(ripple);
            setTimeout(() => {
                ripple.style.opacity = "0";
                ripple.style.transform = "translate(-50%, -50%) scale(1.5)";
                setTimeout(() => ripple.remove(), 900);
            }, 30);
        }
        
        window.addEventListener("load", () => {
            resizeCanvas();
            createItems();
            drawNightBeach();
            window.addEventListener("resize", () => { resizeCanvas(); });
            beachContainer.addEventListener("click", (e) => {
                if(e.target === beachContainer || e.target === canvas) addBeachRipple(e);
            });
            beachContainer.addEventListener("touchstart", (e) => {
                if(e.target === beachContainer || e.target === canvas) {
                    const touch = e.touches[0];
                    addBeachRipple(touch);
                }
            });
        });
    })();
</script>
</body>
</html>
