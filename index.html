<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🍰 DULCE PARAÍSO - Ryoko 🍩</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a0a05;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            padding: 12px;
        }

        .dessert-world {
            position: relative;
            width: 1400px;
            max-width: 100%;
            height: 90vh;
            min-height: 620px;
            background: radial-gradient(ellipse at 30% 40%, #f5d0a9, #e8b88a, #c48a5c);
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,200,0.3);
            overflow-y: auto;
            overflow-x: hidden;
            cursor: pointer;
            border: 3px solid rgba(255, 200, 150, 0.9);
            scrollbar-width: thin;
        }

        /* Fondo con RYOKO loco */
        .sweet-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-item {
            position: absolute;
            font-size: 26px;
            opacity: 0.3;
            animation: floatSweet 20s infinite linear;
            white-space: nowrap;
        }

        /* ESTILOS LOCOS PARA RYOKO */
        .ryoko-crazy {
            position: absolute;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
            animation: crazyFloat 8s infinite alternate ease-in-out;
            text-shadow: 0 0 8px currentColor;
        }

        /* Diferentes estilos para cada tipo de RYOKO */
        .ryoko-style1 { font-family: 'Impact', 'Arial Black', sans-serif; font-size: 28px; letter-spacing: 5px; }
        .ryoko-style2 { font-family: 'Courier New', monospace; font-size: 24px; font-style: italic; letter-spacing: 2px; }
        .ryoko-style3 { font-family: 'Brush Script MT', cursive; font-size: 32px; transform: rotate(-8deg); }
        .ryoko-style4 { font-family: 'Georgia', serif; font-size: 26px; font-weight: normal; text-decoration: underline wavy; }
        .ryoko-style5 { font-family: 'Impact', 'Arial Black', sans-serif; font-size: 35px; transform: rotate(5deg); letter-spacing: 8px; }
        .ryoko-style6 { font-family: monospace; font-size: 22px; font-weight: bold; transform: rotate(-12deg); text-transform: uppercase; }
        .ryoko-style7 { font-family: 'Segoe UI', sans-serif; font-size: 30px; font-style: oblique; letter-spacing: 3px; }
        .ryoko-style8 { font-family: 'Arial Black', sans-serif; font-size: 20px; transform: rotate(15deg); word-break: keep-all; }

        @keyframes crazyFloat {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
            100% { transform: translateY(-25px) rotate(3deg); opacity: 0.55; }
        }

        @keyframes floatSweet {
            0% { transform: translateX(-10%) translateY(0px) rotate(0deg); opacity: 0.2; }
            100% { transform: translateX(110%) translateY(30px) rotate(8deg); opacity: 0.45; }
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 5px rgba(255,150,80,0.3); opacity: 0.3; }
            100% { text-shadow: 0 0 25px rgba(255,150,80,0.7); opacity: 0.6; }
        }

        /* Capa de postres clickeables */
        .dessert-layer {
            position: relative;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 50px 20px 200px 20px;
            pointer-events: none;
        }

        .dessert-item {
            pointer-events: auto;
            cursor: pointer;
            background: rgba(255, 245, 230, 0.92);
            backdrop-filter: blur(6px);
            border-radius: 50px;
            padding: 15px 20px;
            text-align: center;
            transition: transform 0.2s ease;
            border: 2px solid rgba(255, 160, 80, 0.8);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            min-width: 120px;
        }

        .dessert-item:active {
            transform: scale(0.95);
        }

        .dessert-emoji {
            font-size: 65px;
            display: block;
        }

        .dessert-name {
            font-size: 11px;
            color: #7a3a1a;
            margin-top: 8px;
            font-weight: bold;
            background: rgba(255,240,210,0.9);
            padding: 4px 8px;
            border-radius: 30px;
        }

        .message-panel {
            position: sticky;
            bottom: 15px;
            margin: 15px;
            background: rgba(50, 20, 10, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 35px;
            padding: 16px 20px;
            color: #fff5e8;
            font-size: clamp(0.85rem, 4vw, 1.1rem);
            font-weight: 600;
            text-align: center;
            border: 1px solid rgba(255, 180, 100, 0.8);
            z-index: 45;
            max-height: 30vh;
            overflow-y: auto;
            line-height: 1.45;
        }

        .poem-area {
            background: rgba(0, 0, 0, 0.9);
            border-radius: 30px;
            padding: 14px 18px;
            margin-top: 8px;
            white-space: pre-line;
            font-size: clamp(0.8rem, 3.5vw, 0.95rem);
            max-height: 32vh;
            overflow-y: auto;
            line-height: 1.5;
            border: 1px solid rgba(255, 180, 100, 0.7);
            color: #ffe0c0;
        }

        .counter-badge {
            position: sticky;
            top: 15px;
            right: 20px;
            float: right;
            background: rgba(50, 20, 10, 0.95);
            backdrop-filter: blur(10px);
            padding: 6px 20px;
            border-radius: 50px;
            font-weight: bold;
            color: #ffcc99;
            font-family: monospace;
            font-size: 1rem;
            z-index: 50;
            border: 1px solid #ffaa66;
            margin: 15px;
            display: inline-block;
        }

        .flex-header {
            display: flex;
            justify-content: flex-end;
            padding: 10px 20px 0 0;
        }

        @media (max-width: 780px) {
            .dessert-emoji { font-size: 50px; }
            .dessert-item { padding: 10px 15px; min-width: 90px; }
            .dessert-name { font-size: 9px; }
            .ryoko-style1 { font-size: 20px; }
            .ryoko-style2 { font-size: 18px; }
            .ryoko-style3 { font-size: 22px; }
            .ryoko-style5 { font-size: 24px; }
            .ryoko-style7 { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="dessert-world" id="dessertWorld">
    <div class="sweet-bg" id="sweetBg"></div>

    <div class="flex-header">
        <div class="counter-badge" id="dessertCounter">🍩 0 / 6 🍰</div>
    </div>

    <div class="dessert-layer" id="dessertLayer"></div>

    <div class="message-panel" id="messagePanel">
        <div class="romantic-text" id="msgText">🍰🍩 Toca cada postre... cada uno esconde un mensaje dulce y apasionado para ti, Ryoko 💜✨</div>
        <div id="poemDisplay" style="display: none;" class="poem-area"></div>
    </div>
</div>

<script>
    (function() {
        const dessertEmojis = ["🍩", "🍰", "🧁", "🥯", "🍫", "🍓"];
        const dessertNames = [
            "Glazed Donut + Boston Cream", 
            "Jelly Donut + Chocolate Donut", 
            "Cinnamon Roll + Strawberry Cake", 
            "Vanilla Donut + Donut Hole", 
            "Chocolate Cake + Brownie", 
            "Strawberry Cheesecake + Poke Cake"
        ];
        
        const dessertMessages = [
            "🍩 Ryoko, eres más dulce que un glazed donut recién horneado. Cada vez que sonríes, siento que el azúcar se derrite en mi pecho. Quiero morder tus labios como si fueran un Boston cream poke cake, cremosos y adictivos. Eres mi donut favorito, mi dulce obsesión. Te adoro mi alma. 💜",
            "🍰 Jelly donut, llena de sabor como tú, Ryoko. Tu risa es el relleno de mis días grises. Me encanta cuando te ríes y tus mejillas se ponen rosadas como un pastel de fresa. Eres mi postre prohibido, el que quiero saborear todas las noches. Te amo con toda la dulzura del mundo. 🔥🍓",
            "🧁 Cinnamon roll, caliente y suave como tu corazón. Ryoko, tu belleza endulza mi vida más que mil pasteles. Cuando me miras, siento que el glaseado de tus ojos me atrapa. Quiero hornear contigo un amor eterno, mezclando canela y pasión. Eres mi rollito de felicidad. 💜🌙",
            "🥯 Donut de vainilla, simple pero irresistible, como tú. Ryoko, no necesitas nada más para ser perfecta. Tu sonrisa es más adictiva que el chocolate. Cuando caminas, los sprinkles del cielo caen a tus pies. Eres mi donut favorito, mi ancla de dulzura. Te adoro con toda mi alma. 💕",
            "🍫 Chocolate cake, oscuro e intenso como la pasión que siento por ti, Ryoko. Tus labios saben a brownie recién horneado. Me encanta cuando tus manos recorren mi espalda como glaseado caliente. Eres mi pastel prohibido, mi vicio más delicioso. TE AMO más que a cualquier postre. 🔥💜",
            "🍓 Strawberry cheesecake, fresca y cremosa como tú, Ryoko. Tu risa sabe a frutos rojos, tu mirada a crema batida. Cuando estás cerca, todo se vuelve más dulce. Eres mi poke cake favorito, mi postre eterno. Esta noche quiero comerte a besos como un donut recién hecho. A+R = FOREVER 🍰💜"
        ];

        const sweetPoem = `🍰🍩 RYOKO, MI PASTEL ETERNO 🍩🍰

En una panadería del cielo, entre donuts y pasteles,
apareciste tú, más dulce que mil glaseados.
Tus ojos son dos cerezas brillantes,
tus mejillas, crema batida de los ángeles.

Ryoko, eres mi Boston cream poke cake favorito,
mi donut glaseado en las mañanas frías.
Cuando ríes, los sprinkles caen en cascada,
y el azúcar se derrite con tus melodías.

Tu boca sabe a fresa y chocolate derretido,
tus manos son masa suave que quiero amasar.
Cada vez que me abrazas, soy un cinnamon roll,
caliente, esponjoso, lleno de felicidad.

Las velas de los pasteles se encienden por ti,
porque tu belleza merece mil cumpleaños.
Eres mi jelly donut, mi relleno favorito,
el postre que quiero probar todos los años.

A + R = FOREVER, lo escribo con glaseado,
en cada donut, en cada pastel horneado.
Te adoro Ryoko, más que a toda la pastelería,
eres mi dulce para siempre, mi amor, mi alegría.

🍰 TE AMO RYOKO, MI POSTRE FAVORITO 💜
🍩 TE ADORO MI ALMA, ERES MI DULCE INFINITO.`;

        let itemsClicked = 0;
        let poemRevealed = false;
        const counterSpan = document.getElementById("dessertCounter");
        const msgTextDiv = document.getElementById("msgText");
        const poemDisplayDiv = document.getElementById("poemDisplay");
        const container = document.getElementById("dessertWorld");
        const bgContainer = document.getElementById("sweetBg");

        // CRAZY RYOKO NAMES - 8 estilos diferentes, 40 textos locos
        function createCrazyRyokoBackground() {
            bgContainer.innerHTML = "";
            
            // Postres flotantes (light)
            const sweetChars = ["🍩", "🍰", "🧁", "🥯", "🍫", "🍓", "🍪", "🎂", "🍬", "🍭", "🍦", "🥧", "🍮"];
            for(let i = 0; i < 16; i++) {
                const item = document.createElement("div");
                item.className = "floating-item";
                item.textContent = sweetChars[Math.floor(Math.random() * sweetChars.length)];
                item.style.left = Math.random() * 100 + "%";
                item.style.top = Math.random() * 100 + "%";
                item.style.animationDuration = 14 + Math.random() * 18 + "s";
                item.style.animationDelay = Math.random() * 8 + "s";
                item.style.fontSize = 22 + Math.random() * 28 + "px";
                bgContainer.appendChild(item);
            }
            
            // TEXTOS DE RYOKO EN ESTILOS LOCOS - 40 elementos
            const crazyTexts = [
                "🔥 RYOKO 🔥", "💜 RYOKO 💜", "🍩 RYOKO 🍰", "✨ RYOKO ✨", 
                "🌙 RYOKO 💕", "🍫 RYOKO 🍓", "⭐ RYOKO ⭐", "💖 RYOKO 💖",
                "🍩🍰 RYOKO 🧁🍫", "🔥💜 RYOKO 💕🔥", "🍩💕 RYOKO 💕🍩", "💜🔥 RYOKO 🔥💜",
                "😈 RYOKO 😇", "🌈 RYOKO 🌈", "💎 RYOKO 💎", "🎀 RYOKO 🎀",
                "🌹 RYOKO 🌹", "🦄 RYOKO 🦄", "🌟 RYOKO 🌟", "💫 RYOKO 💫",
                "🍬 RYOKO 🍭", "🧁 RYOKO 🍩", "🥧 RYOKO 🎂", "🍪 RYOKO 🍫"
            ];
            
            const styles = [
                "ryoko-style1", "ryoko-style2", "ryoko-style3", "ryoko-style4",
                "ryoko-style5", "ryoko-style6", "ryoko-style7", "ryoko-style8"
            ];
            
            const colors = [
                "#ffaa77", "#ff88aa", "#ffcc66", "#ff9966", 
                "#dd88ff", "#66ffcc", "#ff6688", "#ffcc88",
                "#ffaa99", "#99ffaa", "#ff99cc", "#ffe699"
            ];
            
            for(let i = 0; i < 40; i++) {
                const ryokoDiv = document.createElement("div");
                const styleClass = styles[Math.floor(Math.random() * styles.length)];
                ryokoDiv.className = `ryoko-crazy ${styleClass}`;
                ryokoDiv.textContent = crazyTexts[Math.floor(Math.random() * crazyTexts.length)];
                ryokoDiv.style.left = Math.random() * 100 + "%";
                ryokoDiv.style.top = Math.random() * 100 + "%";
                ryokoDiv.style.color = colors[Math.floor(Math.random() * colors.length)];
                ryokoDiv.style.animationDuration = 6 + Math.random() * 10 + "s";
                ryokoDiv.style.animationDelay = Math.random() * 5 + "s";
                ryokoDiv.style.opacity = 0.25 + Math.random() * 0.25;
                ryokoDiv.style.transform = `rotate(${Math.random() * 50 - 25}deg)`;
                
                // Algunos con efecto de pulso extra
                if(i % 5 === 0) {
                    ryokoDiv.style.animationName = "pulseGlow";
                    ryokoDiv.style.animationDuration = "2s";
                    ryokoDiv.style.animationIterationCount = "infinite";
                    ryokoDiv.style.animationDirection = "alternate";
                }
                bgContainer.appendChild(ryokoDiv);
            }
            
            // Corazones flotantes (solo 8)
            const hearts = ["💜", "🍩", "🍰", "💕", "🍓", "🧁", "💖", "🍫", "❤️", "💗"];
            for(let i = 0; i < 12; i++) {
                const heart = document.createElement("div");
                heart.className = "floating-item";
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + "%";
                heart.style.top = Math.random() * 100 + "%";
                heart.style.animationDuration = 8 + Math.random() * 12 + "s";
                heart.style.animationDelay = Math.random() * 10 + "s";
                heart.style.fontSize = 28 + Math.random() * 32 + "px";
                heart.style.opacity = "0.25";
                bgContainer.appendChild(heart);
            }
        }

        function createDessertItems() {
            const layer = document.getElementById("dessertLayer");
            layer.innerHTML = "";
            for(let i = 0; i < 6; i++) {
                const card = document.createElement("div");
                card.className = "dessert-item";
                card.setAttribute("data-idx", i);
                card.innerHTML = `
                    <div class="dessert-emoji">${dessertEmojis[i]}</div>
                    <div class="dessert-name">${dessertNames[i]}</div>
                `;
                card.addEventListener("click", (e) => {
                    e.stopPropagation();
                    handleDessertClick(i, card);
                });
                layer.appendChild(card);
            }
        }

        function handleDessertClick(idx, element) {
            if(element.getAttribute("data-clicked") === "true") {
                msgTextDiv.innerHTML = `🍰 Ryoko, ya probaste este postre... prueba otro de la colección dulce 🍩💜`;
                return;
            }
            element.setAttribute("data-clicked", "true");
            itemsClicked++;
            counterSpan.innerHTML = `🍩 ${itemsClicked} / 6 🍰`;
            
            const sweetMsg = dessertMessages[idx];
            msgTextDiv.innerHTML = `🍰💜✨ ${sweetMsg} ✨💜🍩`;
            
            element.style.transform = "scale(0.92)";
            element.style.opacity = "0.7";
            element.style.pointerEvents = "none";
            setTimeout(() => { element.style.transform = ""; }, 200);
            
            if(itemsClicked === 6 && !poemRevealed) {
                revealSweetPoem();
            }
        }

        function revealSweetPoem() {
            if(poemRevealed) return;
            poemRevealed = true;
            msgTextDiv.style.display = "none";
            poemDisplayDiv.style.display = "block";
            poemDisplayDiv.innerHTML = `<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-style: normal; font-weight: 500; text-align: center; line-height: 1.5; font-size: 0.85rem;">${sweetPoem.replace(/\n/g, '<br>')}</div><br><div style="text-align:center; font-size:0.9rem;">🍩 A + R = FOREVER EN CADA DONUT 🍰<br>💜 TE AMO RYOKO, MI DULCE INFINITO 💜</div>`;
            counterSpan.style.background = "#b87542dd";
            counterSpan.innerHTML = "🍰 DULCE COLECCIÓN 🍩";
            for(let i=0;i<20;i++) {
                setTimeout(() => createSweetSpark(), i*80);
            }
        }

        function createSweetSpark() {
            const spark = document.createElement("div");
            spark.innerText = ["🍩💜","🍰💕","🧁❤️","🍫🍓","🍬💖"][Math.floor(Math.random()*5)];
            spark.style.position = "absolute";
            spark.style.fontSize = 24 + Math.random() * 28 + "px";
            spark.style.left = Math.random() * 100 + "%";
            spark.style.bottom = "0px";
            spark.style.pointerEvents = "none";
            spark.style.zIndex = "200";
            spark.style.opacity = "0.8";
            spark.style.transition = "all 3s ease-out";
            container.appendChild(spark);
            requestAnimationFrame(() => {
                spark.style.transform = `translateY(-${window.innerHeight * 0.7}px) rotate(12deg)`;
                spark.style.opacity = "0";
            });
            setTimeout(() => spark.remove(), 3000);
        }

        function addSweetRipple(e) {
            const rect = container.getBoundingClientRect();
            const ripple = document.createElement("div");
            ripple.innerText = "🍩💜🍰";
            ripple.style.position = "absolute";
            ripple.style.left = (e.clientX - rect.left) + "px";
            ripple.style.top = (e.clientY - rect.top) + "px";
            ripple.style.fontSize = "38px";
            ripple.style.pointerEvents = "none";
            ripple.style.zIndex = "200";
            ripple.style.transform = "translate(-50%, -50%)";
            ripple.style.opacity = "0.8";
            ripple.style.whiteSpace = "nowrap";
            ripple.style.transition = "all 0.6s ease-out";
            container.appendChild(ripple);
            setTimeout(() => {
                ripple.style.opacity = "0";
                ripple.style.transform = "translate(-50%, -50%) scale(1.5)";
                setTimeout(() => ripple.remove(), 700);
            }, 30);
        }

        createCrazyRyokoBackground();
        createDessertItems();
        
        container.addEventListener("click", (e) => {
            if(e.target === container || e.target.classList.contains("sweet-bg")) {
                addSweetRipple(e);
            }
        });
        container.addEventListener("touchstart", (e) => {
            if(e.target === container || e.target.classList.contains("sweet-bg")) {
                addSweetRipple(e.touches[0]);
            }
        });
    })();
</script>
</body>
</html>
