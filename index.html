<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🍰 DULCE PARAÍSO - Ryoko 🍩</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a0a05;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            padding: 12px;
        }

        .dessert-world {
            position: relative;
            width: 1400px;
            max-width: 100%;
            height: 90vh;
            min-height: 620px;
            background: radial-gradient(ellipse at 30% 40%, #f5d0a9, #e8b88a, #c48a5c);
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,200,0.3);
            overflow-y: auto;
            overflow-x: hidden;
            cursor: pointer;
            border: 3px solid rgba(255, 200, 150, 0.9);
            scrollbar-width: thin;
        }

        /* Fondo dulce con postres y RYOKO */
        .sweet-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-dessert {
            position: absolute;
            font-size: 28px;
            opacity: 0.35;
            animation: floatSweet 18s infinite linear;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
        }

        .sweet-text {
            position: absolute;
            font-size: 38px;
            font-weight: bold;
            font-family: 'Impact', 'Arial Black', sans-serif;
            color: rgba(255, 180, 120, 0.35);
            text-shadow: 0 0 15px rgba(255,150,80,0.5);
            white-space: nowrap;
            pointer-events: none;
            letter-spacing: 3px;
            animation: sweetPulse 3.5s infinite alternate;
        }

        .sweet-heart {
            position: absolute;
            font-size: 30px;
            opacity: 0.25;
            animation: floatHeartSweet 12s infinite alternate;
        }

        @keyframes floatSweet {
            0% { transform: translateX(-10%) translateY(0px) rotate(0deg); opacity: 0.25; }
            100% { transform: translateX(110%) translateY(40px) rotate(10deg); opacity: 0.5; }
        }

        @keyframes sweetPulse {
            0% { text-shadow: 0 0 5px rgba(255,150,80,0.3); opacity: 0.2; }
            100% { text-shadow: 0 0 25px rgba(255,150,80,0.6); opacity: 0.4; }
        }

        @keyframes floatHeartSweet {
            0% { transform: translateY(0px) rotate(-5deg); opacity: 0.15; }
            100% { transform: translateY(-35px) rotate(10deg); opacity: 0.35; }
        }

        /* Capa de postres clickeables */
        .dessert-layer {
            position: relative;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 28px;
            padding: 50px 20px 200px 20px;
            pointer-events: none;
        }

        .dessert-item {
            pointer-events: auto;
            cursor: pointer;
            background: rgba(255, 245, 230, 0.88);
            backdrop-filter: blur(8px);
            border-radius: 56px;
            padding: 18px 22px;
            text-align: center;
            transition: all 0.25s ease;
            border: 2px solid rgba(255, 160, 80, 0.9);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2), 0 0 20px rgba(255,180,100,0.5);
            min-width: 130px;
            animation: dessertGlow 2.5s infinite alternate;
        }

        @keyframes dessertGlow {
            0% { box-shadow: 0 0 8px rgba(255,160,80,0.5); border-color: rgba(255,160,80,0.7); }
            100% { box-shadow: 0 0 25px rgba(255,120,50,0.8); border-color: rgba(255,140,70,1); }
        }

        .dessert-item:active {
            transform: scale(0.94);
            background: rgba(255, 245, 230, 0.96);
        }

        .dessert-emoji {
            font-size: 70px;
            display: block;
            text-shadow: 0 0 12px rgba(255,100,50,0.4);
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
        }

        .dessert-name {
            font-size: 12px;
            color: #7a3a1a;
            margin-top: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(255,240,210,0.8);
            padding: 5px 10px;
            border-radius: 40px;
        }

        .message-panel {
            position: sticky;
            bottom: 15px;
            margin: 15px;
            background: rgba(50, 20, 10, 0.94);
            backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 18px 24px;
            color: #fff5e8;
            font-size: clamp(0.9rem, 4vw, 1.15rem);
            font-weight: 600;
            text-align: center;
            border: 1px solid rgba(255, 180, 100, 0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 30px rgba(255,140,60,0.4);
            z-index: 45;
            max-height: 28vh;
            overflow-y: auto;
            line-height: 1.45;
        }

        .romantic-text {
            font-size: clamp(0.85rem, 3.8vw, 1.1rem);
        }

        .poem-area {
            background: rgba(0, 0, 0, 0.9);
            border-radius: 34px;
            padding: 16px 20px;
            margin-top: 10px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            white-space: pre-line;
            font-size: clamp(0.8rem, 3.5vw, 0.98rem);
            max-height: 32vh;
            overflow-y: auto;
            line-height: 1.5;
            border: 1px solid rgba(255, 180, 100, 0.7);
            color: #ffe0c0;
        }

        .counter-badge {
            position: sticky;
            top: 15px;
            right: 20px;
            float: right;
            background: rgba(50, 20, 10, 0.92);
            backdrop-filter: blur(12px);
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: bold;
            color: #ffcc99;
            font-family: monospace;
            font-size: 1.1rem;
            z-index: 50;
            border: 1px solid #ffaa66;
            margin: 15px;
            display: inline-block;
            box-shadow: 0 2px 15px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        .flex-header {
            display: flex;
            justify-content: flex-end;
            padding: 10px 25px 0 0;
        }

        @media (max-width: 780px) {
            .dessert-emoji { font-size: 52px; }
            .dessert-item { padding: 12px; min-width: 95px; }
            .dessert-name { font-size: 9px; }
            .sweet-text { font-size: 24px; }
        }
    </style>
</head>
<body>
<div class="dessert-world" id="dessertWorld">
    <!-- Fondo dulce -->
    <div class="sweet-bg" id="sweetBg"></div>

    <div class="flex-header">
        <div class="counter-badge" id="dessertCounter">🍩 0 / 6 🍰</div>
    </div>

    <div class="dessert-layer" id="dessertLayer"></div>

    <div class="message-panel" id="messagePanel">
        <div class="romantic-text" id="msgText">🍰🍩 Toca cada postre, donut o pastel... cada uno esconde un mensaje dulce y apasionado para ti, Ryoko 💜✨</div>
        <div id="poemDisplay" style="display: none;" class="poem-area"></div>
    </div>
</div>

<script>
    (function() {
        // 6 postres principales
        const dessertEmojis = ["🍩", "🍰", "🧁", "🥯", "🍫", "🍓"];
        const dessertNames = [
            "Glazed Donut + Boston Cream", 
            "Jelly Donut + Chocolate Donut", 
            "Cinnamon Roll + Strawberry Cake", 
            "Vanilla Donut + Donut Hole", 
            "Chocolate Cake + Brownie", 
            "Strawberry Cheesecake + Poke Cake"
        ];
        
        // Mensajes románticos y dulces
        const dessertMessages = [
            "🍩 Ryoko, eres más dulce que un glazed donut recién horneado. Cada vez que sonríes, siento que el azúcar se derrite en mi pecho. Quiero morder tus labios como si fueran un Boston cream poke cake, cremosos y adictivos. Eres mi donut favorito, mi dulce obsesión. Te adoro mi alma. 💜",
            "🍰 Jelly donut, llena de sabor como tú, Ryoko. Tu risa es el relleno de mis días grises. Me encanta cuando te ríes y tus mejillas se ponen rosadas como un pastel de fresa. Eres mi postre prohibido, el que quiero saborear todas las noches. Te amo con toda la dulzura del mundo. 🔥🍓",
            "🧁 Cinnamon roll, caliente y suave como tu corazón. Ryoko, tu belleza endulza mi vida más que mil pasteles. Cuando me miras, siento que el glaseado de tus ojos me atrapa. Quiero hornear contigo un amor eterno, mezclando canela y pasión. Eres mi rollito de felicidad. 💜🌙",
            "🥯 Donut de vainilla, simple pero irresistible, como tú. Ryoko, no necesitas nada más para ser perfecta. Tu sonrisa es más adictiva que el chocolate. Cuando caminas, los sprinkles del cielo caen a tus pies. Eres mi donut favorito, mi ancla de dulzura. Te adoro con toda mi alma. 💕",
            "🍫 Chocolate cake, oscuro e intenso como la pasión que siento por ti, Ryoko. Tus labios saben a brownie recién horneado. Me encanta cuando tus manos recorren mi espalda como glaseado caliente. Eres mi pastel prohibido, mi vicio más delicioso. TE AMO más que a cualquier postre. 🔥💜",
            "🍓 Strawberry cheesecake, fresca y cremosa como tú, Ryoko. Tu risa sabe a frutos rojos, tu mirada a crema batida. Cuando estás cerca, todo se vuelve más dulce. Eres mi poke cake favorito, mi postre eterno. Esta noche quiero comerte a besos como un donut recién hecho. A+R = FOREVER 🍰💜"
        ];

        const sweetPoem = `🍰🍩 RYOKO, MI PASTEL ETERNO 🍩🍰

En una panadería del cielo, entre donuts y pasteles,
apareciste tú, más dulce que mil glaseados.
Tus ojos son dos cerezas brillantes,
tus mejillas, crema batida de los ángeles.

Ryoko, eres mi Boston cream poke cake favorito,
mi donut glaseado en las mañanas frías.
Cuando ríes, los sprinkles caen en cascada,
y el azúcar se derrite con tus melodías.

Tu boca sabe a fresa y chocolate derretido,
tus manos son masa suave que quiero amasar.
Cada vez que me abrazas, soy un cinnamon roll,
caliente, esponjoso, lleno de felicidad.

Las velas de los pasteles se encienden por ti,
porque tu belleza merece mil cumpleaños.
Eres mi jelly donut, mi relleno favorito,
el postre que quiero probar todos los años.

A + R = FOREVER, lo escribo con glaseado,
en cada donut, en cada pastel horneado.
Te adoro Ryoko, más que a toda la pastelería,
eres mi dulce para siempre, mi amor, mi alegría.

🍰 TE AMO RYOKO, MI POSTRE FAVORITO 💜
🍩 TE ADORO MI ALMA, ERES MI DULCE INFINITO.`;

        let itemsClicked = 0;
        let poemRevealed = false;
        const counterSpan = document.getElementById("dessertCounter");
        const msgTextDiv = document.getElementById("msgText");
        const poemDisplayDiv = document.getElementById("poemDisplay");
        const container = document.getElementById("dessertWorld");
        const bgContainer = document.getElementById("sweetBg");

        // CREAR FONDO DULCE: postres flotantes, RYOKO, corazones
        function createSweetBackground() {
            bgContainer.innerHTML = "";
            
            // Postres flotantes
            const sweetChars = [
                "🍩", "🍰", "🧁", "🥯", "🍫", "🍓", "🍪", "🎂", "🍬", "🍭", 
                "🧁", "🍩", "🍰", "🍫", "🍓", "🍦", "🥧", "🍮", "🍩", "🍰",
                "🍪", "🍬", "🍭", "🧁", "🍩", "🍰", "🍫", "🍓", "🍦", "🥧"
            ];
            
            for(let i = 0; i < 55; i++) {
                const sweetSpan = document.createElement("div");
                sweetSpan.className = "floating-dessert";
                sweetSpan.textContent = sweetChars[i % sweetChars.length];
                sweetSpan.style.left = Math.random() * 100 + "%";
                sweetSpan.style.top = Math.random() * 100 + "%";
                sweetSpan.style.animationDuration = 12 + Math.random() * 22 + "s";
                sweetSpan.style.animationDelay = Math.random() * 8 + "s";
                sweetSpan.style.fontSize = 24 + Math.random() * 34 + "px";
                sweetSpan.style.opacity = 0.25 + Math.random() * 0.25;
                bgContainer.appendChild(sweetSpan);
            }
            
            // Textos de RYOKO en estilo pastel
            const sweetTexts = [
                "🍩 RYOKO 🍰", "💜 RYOKO 🧁", "🍓 RYOKO 🍫", "🎂 RYOKO 🍩", 
                "✨ RYOKO 💕", "🍬 RYOKO 🍭", "🍰 RYOKO 💜", "🍩 RYOKO 🍓"
            ];
            
            for(let i = 0; i < 28; i++) {
                const ryokoDiv = document.createElement("div");
                ryokoDiv.className = "sweet-text";
                ryokoDiv.textContent = sweetTexts[i % sweetTexts.length];
                ryokoDiv.style.left = Math.random() * 100 + "%";
                ryokoDiv.style.top = Math.random() * 100 + "%";
                ryokoDiv.style.fontSize = 26 + Math.random() * 44 + "px";
                ryokoDiv.style.transform = `rotate(${Math.random() * 30 - 15}deg)`;
                ryokoDiv.style.animationDelay = Math.random() * 4 + "s";
                ryokoDiv.style.animationDuration = 3 + Math.random() * 3 + "s";
                bgContainer.appendChild(ryokoDiv);
            }
            
            // Corazones dulces
            const sweetHearts = ["💜", "🍩", "🍰", "💕", "🍓", "🧁", "💖", "🍫"];
            for(let i = 0; i < 45; i++) {
                const heartDiv = document.createElement("div");
                heartDiv.className = "sweet-heart";
                heartDiv.textContent = sweetHearts[i % sweetHearts.length];
                heartDiv.style.left = Math.random() * 100 + "%";
                heartDiv.style.top = Math.random() * 100 + "%";
                heartDiv.style.fontSize = 28 + Math.random() * 48 + "px";
                heartDiv.style.animationDuration = 8 + Math.random() * 14 + "s";
                heartDiv.style.animationDelay = Math.random() * 6 + "s";
                heartDiv.style.opacity = 0.12 + Math.random() * 0.25;
                bgContainer.appendChild(heartDiv);
            }
        }

        function createDessertItems() {
            const layer = document.getElementById("dessertLayer");
            layer.innerHTML = "";
            for(let i = 0; i < 6; i++) {
                const card = document.createElement("div");
                card.className = "dessert-item";
                card.setAttribute("data-idx", i);
                card.innerHTML = `
                    <div class="dessert-emoji">${dessertEmojis[i]}</div>
                    <div class="dessert-name">${dessertNames[i]}</div>
                `;
                card.addEventListener("click", (e) => {
                    e.stopPropagation();
                    handleDessertClick(i, card);
                });
                layer.appendChild(card);
            }
        }

        function handleDessertClick(idx, element) {
            if(element.getAttribute("data-clicked") === "true") {
                msgTextDiv.innerHTML = `🍰 Ryoko, ya probaste este postre... prueba otro de la colección dulce 🍩💜`;
                return;
            }
            element.setAttribute("data-clicked", "true");
            itemsClicked++;
            counterSpan.innerHTML = `🍩 ${itemsClicked} / 6 🍰`;
            
            const sweetMsg = dessertMessages[idx];
            msgTextDiv.innerHTML = `🍰💜✨ ${sweetMsg} ✨💜🍩`;
            
            element.style.transform = "scale(0.9)";
            element.style.opacity = "0.65";
            element.style.filter = "grayscale(0.15)";
            element.style.pointerEvents = "none";
            setTimeout(() => { element.style.transform = ""; }, 200);
            
            if(itemsClicked === 6 && !poemRevealed) {
                revealSweetPoem();
            }
        }

        function revealSweetPoem() {
            if(poemRevealed) return;
            poemRevealed = true;
            msgTextDiv.style.display = "none";
            poemDisplayDiv.style.display = "block";
            poemDisplayDiv.innerHTML = `<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-style: normal; font-weight: 500; text-align: center; line-height: 1.5; font-size: 0.85rem;">${sweetPoem.replace(/\n/g, '<br>')}</div><br><div style="text-align:center; font-size:0.95rem; font-family: monospace;">🍩 A + R = FOREVER EN CADA DONUT 🍰<br>💜 TE AMO RYOKO, MI DULCE INFINITO 💜</div>`;
            counterSpan.style.background = "#b87542dd";
            counterSpan.innerHTML = "🍰 DULCE COLECCIÓN 🍩";
            for(let i=0;i<40;i++) {
                setTimeout(() => createSweetSpark(), i*70);
            }
        }

        function createSweetSpark() {
            const spark = document.createElement("div");
            spark.innerText = ["🍩💜","🍰💕","🧁❤️","🍫🍓","🍬💖","🍭✨"][Math.floor(Math.random()*6)];
            spark.style.position = "absolute";
            spark.style.fontSize = 28 + Math.random() * 32 + "px";
            spark.style.left = Math.random() * 100 + "%";
            spark.style.bottom = "0px";
            spark.style.pointerEvents = "none";
            spark.style.zIndex = "200";
            spark.style.opacity = "0.85";
            spark.style.transition = "all 3.2s ease-out";
            container.appendChild(spark);
            requestAnimationFrame(() => {
                spark.style.transform = `translateY(-${window.innerHeight * 0.75}px) rotate(15deg)`;
                spark.style.opacity = "0";
            });
            setTimeout(() => spark.remove(), 3200);
        }

        function addSweetRipple(e) {
            const rect = container.getBoundingClientRect();
            const rippleDiv = document.createElement("div");
            rippleDiv.innerText = "🍩💜🍰";
            rippleDiv.style.position = "absolute";
            rippleDiv.style.left = (e.clientX - rect.left) + "px";
            rippleDiv.style.top = (e.clientY - rect.top) + "px";
            rippleDiv.style.fontSize = "42px";
            rippleDiv.style.pointerEvents = "none";
            rippleDiv.style.zIndex = "200";
            rippleDiv.style.transform = "translate(-50%, -50%)";
            rippleDiv.style.opacity = "0.9";
            rippleDiv.style.whiteSpace = "nowrap";
            rippleDiv.style.transition = "all 0.7s ease-out";
            container.appendChild(rippleDiv);
            setTimeout(() => {
                rippleDiv.style.opacity = "0";
                rippleDiv.style.transform = "translate(-50%, -50%) scale(1.6)";
                setTimeout(() => rippleDiv.remove(), 800);
            }, 30);
        }

        createSweetBackground();
        createDessertItems();
        
        container.addEventListener("click", (e) => {
            if(e.target === container || e.target.classList.contains("sweet-bg") || e.target.classList.contains("dessert-world")) {
                addSweetRipple(e);
            }
        });
        container.addEventListener("touchstart", (e) => {
            if(e.target === container || e.target.classList.contains("sweet-bg") || e.target.classList.contains("dessert-world")) {
                const touch = e.touches[0];
                addSweetRipple(touch);
            }
        });
    })();
</script>
</body>
</html>
