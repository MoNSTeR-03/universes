<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Playa Real - Ryoko & A 💜 Noche Eterna</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #02040c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            padding: 12px;
        }

        .beach-real {
            position: relative;
            width: 1300px;
            max-width: 100%;
            height: 90vh;
            min-height: 580px;
            border-radius: 48px 48px 32px 32px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 25px 45px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.1);
            border: 1px solid rgba(150, 180, 210, 0.4);
        }

        /* Fondo realista: cielo nocturno profundo */
        .sky-real {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: radial-gradient(ellipse at 40% 30%, #0a1a3a, #010510, #000208);
            z-index: 1;
            overflow: hidden;
        }

        /* Estrellas realistas (miles de puntos) */
        .stars-real {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 2;
        }

        /* Capa de estrellas con animación de parpadeo */
        .star-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 15% 30%, #fff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 75% 45%, #ffe9bb, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 22% 68%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 88% 12%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 55% 83%, #ffefd0, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 34% 22%, #fff8e7, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 68% 54%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 92% 77%, #fff5e0, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 5% 45%, #ffffcc, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 48% 91%, #fffcdf, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 62% 19%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 43% 58%, #ffedb5, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 77% 33%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 19% 85%, #fff5dd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 51% 11%, #fff0cc, rgba(0,0,0,0));
            background-repeat: no-repeat;
            background-size: 250px 250px;
            opacity: 0.9;
            animation: twinkleStars 4s infinite alternate;
        }

        .star-layer2 {
            background-image: 
                radial-gradient(1px 1px at 35% 55%, #f0f0ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 65% 28%, #ffefc0, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 18% 92%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 82% 64%, #fff3d0, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 4% 17%, #fffae6, rgba(0,0,0,0));
            animation: twinkleStars 6s ease-in-out infinite alternate;
            opacity: 0.7;
        }

        @keyframes twinkleStars {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Luna realista */
        .moon-real {
            position: absolute;
            top: 10%;
            right: 12%;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle at 30% 35%, #fffbe8, #ffefb0, #e2c27a);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 235, 160, 0.6), 0 0 90px rgba(255, 200, 100, 0.3);
            z-index: 5;
            animation: moonGlow 6s infinite alternate;
        }

        @keyframes moonGlow {
            0% { box-shadow: 0 0 30px rgba(255, 235, 170, 0.5); transform: scale(1);}
            100% { box-shadow: 0 0 65px rgba(255, 225, 130, 0.9); transform: scale(1.02);}
        }

        .moon-real::after {
            content: "🌙";
            position: absolute;
            font-size: 75px;
            top: -10px;
            left: 5px;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Océano realista con capas */
        .ocean-real {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48%;
            background: linear-gradient(180deg, #0a2f4a, #021a2a, #000e18);
            z-index: 3;
            overflow: hidden;
        }

        /* Capas de olas en movimiento */
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(transparent 0px, transparent 70px, rgba(80, 160, 210, 0.15) 70px, rgba(100, 180, 230, 0.1) 85px);
            pointer-events: none;
        }

        .wave-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: repeating-linear-gradient(90deg, 
                rgba(150, 210, 250, 0.2) 0px, 
                rgba(90, 170, 230, 0.1) 50px,
                rgba(200, 230, 255, 0.25) 100px);
            animation: moveWaves 8s linear infinite;
            border-radius: 40% 30% 0 0;
        }

        .wave-layer2 {
            animation: moveWaves 12s linear infinite reverse;
            opacity: 0.6;
            height: 70%;
            bottom: 5%;
        }

        @keyframes moveWaves {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        /* Arena realista */
        .sand-real {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 28%;
            background: radial-gradient(ellipse at 30% 80%, #ba8b5a, #8b5e2c, #5a3a1a);
            z-index: 4;
            border-radius: 80% 80% 0 0 / 40px 40px 0 0;
            box-shadow: inset 0 8px 15px rgba(0,0,0,0.3), 0 -5px 10px rgba(0,0,0,0.2);
        }

        .sand-texture {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 15% 40%, rgba(210, 160, 90, 0.4) 1px, transparent 1px);
            background-size: 12px 12px;
            pointer-events: none;
        }

        /* Siluetas de la pareja sentada */
        .couple-silhouette {
            position: absolute;
            bottom: 19%;
            left: 35%;
            z-index: 15;
            display: flex;
            gap: 30px;
            align-items: flex-end;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.5));
        }

        .person {
            text-align: center;
        }

        .person .silhouette {
            font-size: 90px;
            line-height: 1;
            text-shadow: 0 3px 5px black;
            display: block;
        }

        .person .name {
            color: rgba(255, 245, 200, 0.85);
            font-size: 18px;
            font-weight: bold;
            margin-top: -10px;
            font-family: monospace;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.5);
            padding: 2px 10px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }

        /* Elementos clickeables (conchas, estrellas de mar realistas) */
        .items-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            z-index: 20;
            pointer-events: none;
        }

        .beach-item {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
            transition: transform 0.2s ease, filter 0.2s;
            width: clamp(50px, 11vw, 70px);
            text-align: center;
            z-index: 25;
            transform-origin: center;
        }

        .beach-item:active {
            transform: scale(0.9);
        }

        .item-emoji {
            font-size: clamp(45px, 10vw, 60px);
            display: inline-block;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: all 0.2s;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            padding: 5px;
        }

        /* Panel de mensajes igual que antes */
        .message-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(8, 18, 35, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 18px 22px;
            color: #fff5e8;
            font-size: clamp(0.9rem, 4vw, 1.2rem);
            font-weight: 600;
            text-align: center;
            border: 1px solid rgba(255, 220, 170, 0.7);
            box-shadow: 0 10px 28px rgba(0,0,0,0.6), 0 0 30px rgba(80, 120, 200, 0.3);
            z-index: 40;
            max-height: 32vh;
            overflow-y: auto;
            line-height: 1.5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        .romantic-text {
            font-size: clamp(0.85rem, 3.8vw, 1.15rem);
            letter-spacing: 0.2px;
        }

        .poem-area {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 32px;
            padding: 14px 18px;
            margin-top: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            white-space: pre-line;
            font-size: clamp(0.8rem, 3.5vw, 1rem);
            max-height: 36vh;
            overflow-y: auto;
            line-height: 1.5;
            border: 1px solid rgba(255, 220, 170, 0.5);
        }

        .item-counter {
            position: absolute;
            top: 16px;
            right: 20px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            padding: 6px 15px;
            border-radius: 40px;
            font-weight: bold;
            color: #ffe6c7;
            font-family: monospace;
            font-size: 1rem;
            z-index: 45;
            border: 1px solid #f7d49c;
            box-shadow: 0 2px 8px black;
            letter-spacing: 1px;
        }

        @media (max-width: 700px) {
            .beach-item { width: 55px; }
            .item-emoji { font-size: 48px; }
            .person .silhouette { font-size: 60px; }
            .person .name { font-size: 12px; }
            .moon-real { width: 65px; height: 65px; top: 8%; right: 8%; }
        }
    </style>
</head>
<body>
<div class="beach-real">
    <!-- Cielo real con estrellas -->
    <div class="sky-real">
        <div class="stars-real star-layer"></div>
        <div class="stars-real star-layer2"></div>
    </div>
    <!-- Luna realista -->
    <div class="moon-real"></div>
    
    <!-- Océano con movimiento -->
    <div class="ocean-real">
        <div class="wave-layer"></div>
        <div class="wave-layer wave-layer2"></div>
        <div class="wave"></div>
    </div>
    
    <!-- Arena con textura -->
    <div class="sand-real">
        <div class="sand-texture"></div>
    </div>
    
    <!-- Silueta de la pareja: A + Ryoko sentados juntos -->
    <div class="couple-silhouette">
        <div class="person">
            <span class="silhouette">🧑‍🦱</span>
            <div class="name">A</div>
        </div>
        <div class="person">
            <span class="silhouette">👩‍🦰</span>
            <div class="name">RYOKO ❤️</div>
        </div>
    </div>
    
    <!-- Elementos interactivos (conchas y estrellas de mar) -->
    <div class="items-layer" id="itemsLayer"></div>
    
    <!-- Panel de mensajes y poema -->
    <div class="message-panel" id="messagePanel">
        <div class="romantic-text" id="msgText">🌊 Toca cada concha o estrella de mar... cada una guarda una confesión ardiente para ti, Ryoko 🌙✨</div>
        <div id="poemDisplay" style="display: none;" class="poem-area"></div>
    </div>
    <div class="item-counter" id="itemCounter">🐚 0 / 6 🌙</div>
</div>

<script>
    (function() {
        // OBJETOS REALISTAS DE PLAYA
        const itemEmojis = ["🐚", "⭐", "🐚", "🌊", "🐚", "⭐"];
        const itemMessages = [
            "🌙 Ryoko, esta noche la luna nos abraza. Cuando nuestras manos se rozan en la arena siento electricidad pura. Quiero apretar tu cintura mientras las olas nos cantan. Tu risa puede calmar el mar furioso y tus labios son dos olas que quiero besar eternamente. 💜 Te adoro mi alma, aquí junto al mar infinito.",
            "⭐ Cada estrella que ves fue testigo de cómo me enamoré de ti. Desde que llegaste, el cielo nocturno brilla distinto. Ryoko, tu sonrisa derrite la noche. Cuando te sientas a mi lado, siento que el universo entero nos pertenece. Quiero abrazarte hasta que salga el sol. 🌹🔥",
            "🐚 Esta concha guarda el eco de tu nombre. Ryoko, eres la marea que sube dentro de mí. Tus caderas son dunas suaves que quiero explorar bajo la luna. Déjame susurrarte al oído cuánto me haces vibrar. No necesito nada más, solo verte sonreír. Eres mi puerto, mi faro. 💋",
            "🌊 El mar murmuró tu nombre, Ryoko. Cuando estamos cerca, las olas aplauden. Tus manos frías buscando calor en mi pecho me vuelven loco. Quiero recostarme contigo en la arena y contarte que eres la dueña de mis sueños. Esta noche es nuestra, amor. TE AMO con todo el océano dentro. 🔥",
            "🐚 Esta caracola trajo un mensaje del fondo del mar: Ryoko es única. Tu pelo brilla como reflejos de luna en el agua. Tu cuerpo es una obra de arte que quisiera admirar cada noche. Cuando ríes, hasta los pescadores dejan de pescar para escucharte. Te adoro, mi sirena favorita. 💖",
            "⭐ Última estrella: Ryoko, eres mi constelación personal. No hay mapa que me pierda porque tus ojos me guían. Cuando caminas descalza por la orilla, la arena te besa los pies como yo quiero besarte a ti. Gracias por esta noche, por existir, por ser mi todo. A+R = POR SIEMPRE 🌙"
        ];

        const romanticPoem = `🌙✨ RYOKO, MI PLAYA ETERNA ✨🌙

La noche nos regala su manto más profundo,
y tú brillas más que el reflejo de la luna en el agua.
Tus labios tienen sabor a caramelo salado,
cada beso tuyo es un faro que enciende mis mares.

Tu cabello se ondula como las olas en calma,
tus mejillas son dos conchas rosadas que me vuelven loco.
Cuando entrelazas tus dedos con los míos,
el mundo se detiene y el viento susurra te amo.

Ryoko, tu risa puede resucitar marineros perdidos,
tu mirada puede calmar tormentas de mil años.
Acostada en la arena junto a mí,
haces que las estrellas se pongan de pie para verte.

Eres mi marea alta y baja, mi latido nocturno.
Me haces sentir fuego dentro del frío mar.
Cada curva de tu cuerpo es un tesoro enterrado,
y yo pasaría siglos buscándote sin cansarme.

A + R = FOREVER, lo escribo en la orilla,
el agua lo borra pero el viento lo graba en la arena.
Te adoro, Ryoko, más que a la luna y sus secretos.
Esta noche es nuestra, como todas las que están por venir.

🌊 TE AMO RYOKO, MI PLAYA, MI CIELO, MI OCÉANO 💜`;

        const itemsData = [];
        let itemsClicked = 0;
        let poemRevealed = false;
        const counterSpan = document.getElementById("itemCounter");
        const msgTextDiv = document.getElementById("msgText");
        const poemDisplayDiv = document.getElementById("poemDisplay");

        function createItems() {
            const layer = document.getElementById("itemsLayer");
            layer.innerHTML = "";
            const positions = [
                {l: 12, t: 72}, {l: 78, t: 68}, {l: 45, t: 75}, 
                {l: 30, t: 80}, {l: 65, t: 70}, {l: 88, t: 62}
            ];
            for(let i = 0; i < 6; i++) {
                const itemDiv = document.createElement("div");
                itemDiv.className = "beach-item";
                itemDiv.style.left = `${positions[i].l}%`;
                itemDiv.style.bottom = `${positions[i].t}%`;
                itemDiv.style.bottom = `${positions[i].t}%`;
                itemDiv.innerHTML = `<div class="item-emoji">${itemEmojis[i]}</div>`;
                itemDiv.setAttribute("data-index", i);
                itemDiv.addEventListener("click", (e) => {
                    e.stopPropagation();
                    handleItemClick(i, itemDiv);
                });
                layer.appendChild(itemDiv);
                itemsData.push({ element: itemDiv, clicked: false, msg: itemMessages[i] });
            }
        }

        function handleItemClick(index, element) {
            if(itemsData[index].clicked) {
                msgTextDiv.innerHTML = `🌊 Ryoko, ya abriste este tesoro... prueba otra concha o estrella 🌟💜`;
                return;
            }
            itemsData[index].clicked = true;
            itemsClicked++;
            counterSpan.innerHTML = `🐚 ${itemsClicked} / 6 🌙`;
            
            const romanticMsg = itemsData[index].msg;
            msgTextDiv.innerHTML = `🌕✨ ${romanticMsg} ✨🌕`;
            
            element.style.transform = "scale(0.85)";
            setTimeout(() => { element.style.transform = ""; }, 150);
            element.style.opacity = "0.5";
            element.style.filter = "grayscale(0.3)";
            element.style.pointerEvents = "none";
            
            if(itemsClicked === 6 && !poemRevealed) {
                revealPoem();
            }
        }

        function revealPoem() {
            if(poemRevealed) return;
            poemRevealed = true;
            msgTextDiv.style.display = "none";
            poemDisplayDiv.style.display = "block";
            poemDisplayDiv.innerHTML = `<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-style: normal; font-weight: 500; text-align: center; line-height: 1.5; font-size: 0.85rem;">${romanticPoem.replace(/\n/g, '<br>')}</div><br><div style="text-align:center; font-size:1rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-style: normal;">🐚 A + R = PARA SIEMPRE EN CADA OLA 🌊<br>💜 TE AMO RYOKO, MI PLAYA Y MI CIELO 💜</div>`;
            counterSpan.style.background = "#9b6effdd";
            counterSpan.innerHTML = "💖 AMOR ETERNO 💖";
            for(let i=0;i<28;i++) {
                setTimeout(() => createHeart(), i*70);
            }
        }

        function createHeart() {
            const heartDiv = document.createElement("div");
            heartDiv.innerText = ["🌊💜","🐚🔥","⭐💋","🌙❤️"][Math.floor(Math.random()*4)];
            heartDiv.style.position = "absolute";
            heartDiv.style.fontSize = 24 + Math.random() * 26 + "px";
            heartDiv.style.left = Math.random() * 100 + "%";
            heartDiv.style.bottom = "0px";
            heartDiv.style.pointerEvents = "none";
            heartDiv.style.zIndex = "100";
            heartDiv.style.opacity = "0.85";
            heartDiv.style.transition = "all 3s ease-out";
            document.querySelector(".beach-real").appendChild(heartDiv);
            requestAnimationFrame(() => {
                heartDiv.style.transform = `translateY(-${window.innerHeight * 0.7}px) rotate(12deg)`;
                heartDiv.style.opacity = "0";
            });
            setTimeout(() => heartDiv.remove(), 3000);
        }

        function addRipple(e) {
            const rect = document.querySelector(".beach-real").getBoundingClientRect();
            const ripple = document.createElement("div");
            ripple.innerText = "🌊💜🌙";
            ripple.style.position = "absolute";
            ripple.style.left = (e.clientX - rect.left) + "px";
            ripple.style.top = (e.clientY - rect.top) + "px";
            ripple.style.fontSize = "32px";
            ripple.style.pointerEvents = "none";
            ripple.style.zIndex = "100";
            ripple.style.transform = "translate(-50%, -50%)";
            ripple.style.opacity = "0.9";
            ripple.style.whiteSpace = "nowrap";
            ripple.style.transition = "all 0.8s ease-out";
            document.querySelector(".beach-real").appendChild(ripple);
            setTimeout(() => {
                ripple.style.opacity = "0";
                ripple.style.transform = "translate(-50%, -50%) scale(1.5)";
                setTimeout(() => ripple.remove(), 800);
            }, 30);
        }

        createItems();
        const beachContainer = document.querySelector(".beach-real");
        beachContainer.addEventListener("click", (e) => {
            if(e.target.classList.contains("beach-real") || e.target === beachContainer) addRipple(e);
        });
        beachContainer.addEventListener("touchstart", (e) => {
            if(e.target.classList.contains("beach-real") || e.target === beachContainer) {
                const touch = e.touches[0];
                addRipple(touch);
            }
        });
    })();
</script>
</body>
</html>
